
worker_processes 1;

events {
    worker_connections 1024;
}

http {

    proxy_cache_path /opt/homebrew/var/cache/nginx
        levels=1:2
        keys_zone=my_cache:10m
        max_size=100m
        inactive=60m
        use_temp_path=off;

    upstream backend_servers {
        server 10.7.23.31:3001;
        server 10.7.23.5:3002;
    }

    # HTTP
    server {
        listen 8080;
        server_name app.team1.test;

        location / {
            proxy_cache my_cache;
            proxy_cache_valid 200 30s;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name app.team1.test;

        ssl_certificate /opt/homebrew/etc/nginx/certs/app.team1.test.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.team1.test.key;

        # Cache the main page
        location = / {
            proxy_cache my_cache;
            proxy_cache_valid 200 30s;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keep API uncached for A/B load-balancing demonstration
        location /api/ {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

