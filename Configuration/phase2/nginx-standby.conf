# ---------------------------------------------------------------------------
# STANDBY edge  -  Mac 4  -  10.7.10.160   (Extension E)
# File on the Mac : /opt/homebrew/etc/nginx/nginx.conf
# Test + reload   : nginx -t && sudo nginx -s reload
# Identical to nginx-edge.conf. Upstreams use the backends' LAN addresses (never
# 127.0.0.1: the pf rule on Backend B also filters the loopback path).
# The same certificate + key as the primary edge are copied here out-of-band.
# ---------------------------------------------------------------------------
worker_processes 1;

events {
    worker_connections 1024;
}

http {

    proxy_cache_path /opt/homebrew/var/cache/nginx
        levels=1:2
        keys_zone=my_cache:10m
        max_size=100m
        inactive=60m
        use_temp_path=off;

    # Round-robin pool. max_fails / fail_timeout implement passive health
    # checking (Extension D): after a failed attempt the dead backend is skipped
    # for fail_timeout seconds and requests go to the healthy one.
    upstream backend_servers {
        server 10.7.28.30:3001  max_fails=1 fail_timeout=10s;   # Backend A - Mac 3
        server 10.7.10.160:3002 max_fails=1 fail_timeout=10s;   # Backend B - Mac 4
    }

    # Retry the next backend on connection errors, timeouts and 5xx from upstream.
    proxy_connect_timeout   3s;
    proxy_next_upstream     error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # HTTP (plain) - kept for the Phase 1 caching demo
    server {
        listen 8080;
        server_name app.team1.test;

        location / {
            proxy_cache my_cache;
            proxy_cache_valid 200 30s;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS - TLS terminates here
    server {
        listen 443 ssl;
        server_name app.team1.test;

        ssl_certificate     /opt/homebrew/etc/nginx/certs/app.team1.test.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.team1.test.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Cached main page (Cache-Control: max-age=30 from the backends)
        location = / {
            proxy_cache my_cache;
            proxy_cache_valid 200 30s;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API is NOT cached, so A/B alternation stays visible
        location /api/ {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
