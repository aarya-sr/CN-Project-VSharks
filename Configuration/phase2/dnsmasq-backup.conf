# ---------------------------------------------------------------------------
# Backup DNS server  -  Mac 4  -  10.7.10.160     (Extension A)
# Serves exactly the same project records as the primary. Clients list it as
# their second resolver, so names keep resolving if Mac 1 is stopped.
# File on the Mac : /opt/homebrew/etc/dnsmasq.conf
# ---------------------------------------------------------------------------
port=53
listen-address=127.0.0.1,10.7.10.160
bind-interfaces

address=/app.team1.test/10.7.31.36
address=/api.team1.test/10.7.31.36

host-record=ttl.team1.test,10.7.28.30,30

# Extension E - keep identical to the primary when the cutover is performed:
#address=/app.team1.test/10.7.10.160
#address=/api.team1.test/10.7.10.160
