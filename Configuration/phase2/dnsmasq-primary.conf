# ---------------------------------------------------------------------------
# Primary DNS server  -  Mac 1  -  10.7.18.185
# File on the Mac : /opt/homebrew/etc/dnsmasq.conf
# Syntax check    : sudo /opt/homebrew/sbin/dnsmasq --test --conf-file=/opt/homebrew/etc/dnsmasq.conf
# Start / stop    : sudo brew services start|stop|restart dnsmasq
# ---------------------------------------------------------------------------
port=53
listen-address=127.0.0.1,10.7.18.185
bind-interfaces

# Project records (Phase 1) - both names point at the edge / reverse proxy.
# address= answers are served authoritatively (flag "aa") with TTL 0.
address=/app.team1.test/10.7.31.36
address=/api.team1.test/10.7.31.36

# Extension B - dedicated short-TTL record used for the TTL / cache demo.
# Third field is the TTL in seconds. Re-point this record to demonstrate caching.
host-record=ttl.team1.test,10.7.28.30,30

# Extension E - DNS cutover to the standby edge (10.7.10.160).
# Comment out the two address= lines above and enable these two:
#address=/app.team1.test/10.7.10.160
#address=/api.team1.test/10.7.10.160
